<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Profile Qroom</title>
    <style>
        /* Animasi Latar Belakang Bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi Muncul ke Atas */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animasi Mengambang untuk Foto */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #083b5c, #ef7922, #083b5c);
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin: 20px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }
        .desc {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
            opacity: 0.95;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: fadeUp 0.6s ease-out forwards;
        }
        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        /* Delay animasi tiap tombol agar muncul bergantian */
        .wa-btn { background-color: #25D366; animation-delay: 0.3s; }
        .ig-btn { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); animation-delay: 0.5s; }
        .tt-btn { background-color: #000000; animation-delay: 0.7s; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Selamat Datang di Qroom</div>
    
    <img src="foto.jpg" alt="Foto Produk" class="profile-pic">
    
    <div class="desc">Sewa apartemen harian murah by Qroom, untuk info lebih lanjut bisa hubungi kami di bawah ini.</div>
    
    <a href="https://Wa.me/6285199200152" class="link-btn wa-btn" target="_blank">WhatsApp</a>
    
    <a href="https://www.instagram.com/qroom_real" class="link-btn ig-btn" target="_blank">Instagram</a>
    
    <a href="https://tiktok.com/" class="link-btn tt-btn" target="_blank">TikTok</a>
</div>

</body>
</html>
